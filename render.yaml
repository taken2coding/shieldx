services:
  - type: web
    name: shieldx-website
    env: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com https://umami-postgresql-latest-8xgn.onrender.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://api.fontshare.com data:; img-src 'self' data: https://images.unsplash.com https://cdn.prod.website-files.com https://videos.pexels.com https://images.pexels.com; media-src 'self' https://videos.pexels.com; connect-src 'self' https://fonts.googleapis.com https://api.fontshare.com https://umami-postgresql-latest-8xgn.onrender.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
